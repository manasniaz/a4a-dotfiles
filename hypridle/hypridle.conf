# hypridle: idle handling. Written in hypridle's own format (hyprlang), not Lua.
# Each listener runs its command after `timeout` seconds without input, and its
# on-resume command when input comes back.

general {
    # Locks the session. Also runs when the lid closes or the system sleeps,
    # through loginctl lock-session (before_sleep_cmd below).
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    # Some panels don't light up again after a suspend without a DPMS wake.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 3 minutes: dim the screen. -s saves the level, -r puts it back.
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 minutes: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 20 minutes: suspend.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
