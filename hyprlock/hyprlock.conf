# hyprlock: the lock screen. Written in hyprlock's own format (hyprlang), not the
# Lua used for Hyprland itself. Colours come from the wallpaper palette.

source = ~/.cache/a4a/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The current wallpaper, blurred, behind the clock. a4a-wallpaper writes it as
# ~/.cache/a4a/lock.jpg on every change, and a4a-lock checks it against what awww is
# showing before each lock, so it always matches the desktop. The colour is only the
# fallback before the first wallpaper.
background {
    monitor =
    path = ~/.cache/a4a/lock.jpg
    color = $bg
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    # A soft shadow keeps it readable on a bright wallpaper.
    shadow_passes = 2
    shadow_size = 4
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $fgdim
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = 23
    outline_thickness = 1
    outer_color = $muted
    inner_color = $surface
    font_color = $fg
    check_color = $accent
    fail_color = $accent
    placeholder_text = Password
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
