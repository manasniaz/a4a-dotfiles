# Memory tuning for a zram-backed swap (see zram-generator.conf).
# Installed to /etc/sysctl.d/99-a4a-memory.conf.
# With compressed swap in RAM, swapping early is cheap, so the kernel can keep
# idle pages out of the way instead of holding on to them.
vm.swappiness = 180
vm.page-cluster = 0
vm.vfs_cache_pressure = 80
