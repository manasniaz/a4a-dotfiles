# zram: compressed RAM used as swap. On a 7 GB laptop this lets memory spikes
# squeeze into compressed pages instead of forcing the disk to swap or the
# kernel to kill something. Installed to /etc/systemd/zram-generator.conf.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
