# kitty. Colours come from the wallpaper palette (see matugen/templates/kitty-colors.conf),
# so this file only holds layout and type.

include ~/.cache/a4a/kitty-colors.conf

# zsh by name: kitty otherwise takes $SHELL from the environment it started with,
# which goes stale after a login-shell change until kitty is fully quit.
shell                /usr/bin/zsh

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        12
adjust_line_height 110%

# Room around the text and a calm, minimal chrome.
window_padding_width 14
hide_window_decorations yes
tab_bar_style        hidden
confirm_os_window_close 0
enable_audio_bell    no

# Slightly see-through so Hyprland's blur shows behind the text.
background_opacity   0.92
dynamic_background_opacity yes

cursor_shape         beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_trail         1

scrollback_lines     2000
copy_on_select       clipboard
mouse_hide_wait      2.0

# URLs underline on hover; everything else stays plain.
url_style            curly
detect_urls          yes
