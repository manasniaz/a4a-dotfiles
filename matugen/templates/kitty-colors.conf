# Generated from the wallpaper by matugen. Do not edit: rewritten on every
# wallpaper change. kitty.conf includes it, and the terminal reloads on SIGUSR1.

background            {{colors.background.dark.hex}}
foreground            {{colors.on_surface.dark.hex}}
cursor                {{colors.primary.dark.hex}}
cursor_text_color     {{colors.background.dark.hex}}
selection_background  {{colors.surface_container_high.dark.hex}}
selection_foreground  {{colors.on_surface.dark.hex}}
url_color             {{colors.tertiary.dark.hex}}
active_border_color   {{colors.primary.dark.hex}}
inactive_border_color {{colors.outline_variant.dark.hex}}
active_tab_background {{colors.surface_container.dark.hex}}
active_tab_foreground {{colors.on_surface.dark.hex}}
inactive_tab_background {{colors.background.dark.hex}}
inactive_tab_foreground {{colors.outline.dark.hex}}

# Normal colours (0-7), then bright (8-15). Same roles in both halves, so
# ls, btop and fastfetch read the same way in every shell.
color0  {{colors.surface_container.dark.hex}}
color1  {{colors.error.dark.hex}}
color2  {{colors.tertiary.dark.hex}}
color3  {{colors.tertiary_container.dark.hex}}
color4  {{colors.primary.dark.hex}}
color5  {{colors.secondary.dark.hex}}
color6  {{colors.primary_container.dark.hex}}
color7  {{colors.on_surface_variant.dark.hex}}
color8  {{colors.outline.dark.hex}}
color9  {{colors.error.dark.hex}}
color10 {{colors.tertiary.dark.hex}}
color11 {{colors.tertiary_container.dark.hex}}
color12 {{colors.primary.dark.hex}}
color13 {{colors.secondary.dark.hex}}
color14 {{colors.primary_container.dark.hex}}
color15 {{colors.on_surface.dark.hex}}
