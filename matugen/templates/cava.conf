# Generated from the wallpaper by matugen. Do not edit: rewritten on every
# wallpaper change. This is cava's own config file (~/.config/cava/config).

[general]
framerate = 60
bars = 0
bar_width = 2
bar_spacing = 1

# PulseAudio input: PipeWire provides it, and this is the one cava connects to reliably.
[input]
method = pulse
source = auto

[output]
method = noncurses
orientation = bottom
channels = stereo

[color]
background = "default"
gradient = 1
gradient_color_1 = '{{colors.primary_container.dark.hex}}'
gradient_color_2 = '{{colors.primary.dark.hex}}'
gradient_color_3 = '{{colors.tertiary.dark.hex}}'
gradient_color_4 = '{{colors.on_surface.dark.hex}}'

[smoothing]
noise_reduction = 77
